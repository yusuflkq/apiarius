name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The Claude Code release these checks were last run with. Raise it on purpose.
  CLAUDE_CODE_VERSION: 2.1.312
  # No auto-update, telemetry or error reports from the runner.
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}

      - name: Versions
        run: |
          node --version
          claude --version

      - name: Validate the plugin and its marketplace
        run: claude plugin validate --strict --profile directory .

      # One test file at a time: the kit gives a test 5 s of wall time, and
      # with every file at once on the runner's few cores a busy test outruns
      # it. Claude Code resolves a file call's path the way the host does, so
      # a test of a path only Windows spells (a drive letter, an 8.3 short
      # name) runs on Windows alone, and its twin with POSIX paths on Linux.
      - name: Mod tests
        shell: bash
        run: |
          shopt -s nullglob
          held=$(mktemp -d)
          mv tests/*.test.ts tests/*.test.tsx "$held"/
          failed=()
          for file in "$held"/*; do
            name=$(basename "$file")
            cp "$file" tests/
            echo "::group::$name"
            claude plugin test . || failed+=("$name")
            echo "::endgroup::"
            rm "tests/$name"
          done
          mv "$held"/* tests/
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::Failing test files: ${failed[*]}"
            exit 1
          fi

      - name: Web server and page tests
        run: node --test web/test/

      # Real git against hostile repositories: no command the deck runs may run what a repository's own settings name.
      - name: Git against hostile repositories
        if: runner.os != 'Windows'
        run: node --test tests/gitpoc.test.mjs

      - name: Sample data matches its builder
        run: node web/fixtures/make-v2.mjs --check
